name: Release

# Pushing a tag is the whole release. `git tag v0.4.0 && git push --tags`
# builds, verifies, publishes to PyPI, and opens a GitHub Release.
on:
  push:
    tags: ["v*"]

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

# A release must never race itself. Two runs uploading the same version
# means one of them fails halfway, so queue instead of cancelling.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The drift guard: v0.4.0 must mean pyproject says 0.4.0. Without this
      # a mistyped tag ships the wrong version number to PyPI, where it is
      # permanent — PyPI never lets a version be re-uploaded.
      - name: Tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $pkg — bump one of them"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      # brainscope ships its UI as package-data. A packaging mistake here
      # produces a wheel that installs fine and then 404s every page, so
      # check the built artifact rather than trusting the config.
      - name: Wheel carries the static assets
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheel = next(iter(pathlib.Path("dist").glob("*.whl")), None)
          if wheel is None:
              sys.exit("::error::no wheel in dist/")
          names = zipfile.ZipFile(wheel).namelist()
          missing = [
              want
              for want in ("brainscope/static/", "brainscope/AGENTS.md")
              if not any(n.startswith(want) for n in names)
          ]
          if missing:
              sys.exit(f"::error::{wheel.name} is missing {missing}")
          static = sum(n.startswith("brainscope/static/") for n in names)
          print(f"{wheel.name}: {static} static files, AGENTS.md present")
          PY

      # Install the wheel somewhere clean and run the same smoke test CI
      # runs from a source checkout — this is what users actually get.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet dist/*.whl
          /tmp/relcheck/bin/python -c "from brainscope.server import STATIC; assert STATIC.exists(), 'static assets missing from wheel'"
          /tmp/relcheck/bin/brainscope --help > /dev/null
          /tmp/relcheck/bin/brainscope-jlens --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Named so PyPI's trusted publisher can be scoped to it, and so a
    # required reviewer can be added later without touching this file.
    environment:
      name: pypi
      url: https://pypi.org/p/brainscope
    permissions:
      # The only privileged scope in this file, and only in this job:
      # it lets GitHub mint the short-lived OIDC token PyPI verifies.
      # No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Open the release with notes from the commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
