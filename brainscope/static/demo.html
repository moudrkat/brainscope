<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brainscope demo app</title>
<style>
  /* The demo app deliberately does NOT look like the instruments: light,
     friendly, app-like. Tweak these vars to echo your own app's brand on a
     private deploy (the public default stays neutral). */
  :root {
    --ground:#faf7f2; --panel:#ffffff; --panel2:#f3eee6; --line:#e4dccd; --line2:#cfc4ae;
    --ink:#31302e; --muted:#7a7468; --faint:#a89f8f; --accent:#e07856; --live:#3d9d7d;
    --bubble-user:#e07856; --bubble-user-ink:#fff;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:15px var(--sans);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 22px 10px; display:flex; justify-content:space-between; align-items:center; }
  .wordmark { font-weight:700; font-size:17px; } .wordmark b { color:var(--accent); }
  .wordmark small { color:var(--faint); font-size:11px; margin-left:10px; font-weight:400; }
  #sys { margin:0 22px 10px; }
  #sys summary { color:var(--muted); font-size:12px; cursor:pointer; }
  #sysprompt { width:100%; height:84px; margin-top:6px; background:var(--panel);
               color:var(--ink); border:1px solid var(--line); border-radius:8px;
               font:12px var(--mono); padding:8px 10px; resize:vertical; }
  #steer { margin:0 22px 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
           color:var(--muted); font-size:12px; }
  #steer select, #steer input[type=number] { background:var(--panel); color:var(--ink);
           border:1px solid var(--line); border-radius:4px; font:12px var(--mono); padding:4px 7px; }
  #scale { accent-color:var(--accent); width:140px; }
  #scaleval { color:var(--accent); font-weight:700; min-width:34px; }
  #chat { flex:1; overflow-y:auto; margin:0 22px; padding:14px; background:var(--panel2);
          border:1px solid var(--line); border-radius:14px; }
  .msg { max-width:78%; margin:7px 0; padding:10px 14px; border-radius:14px;
         white-space:pre-wrap; line-height:1.5; }
  .user { background:var(--bubble-user); color:var(--bubble-user-ink); margin-left:auto;
          border-bottom-right-radius:4px; }
  .row { display:flex; align-items:flex-end; gap:8px; }
  .avatar { width:38px; height:38px; flex:none; font-size:28px; line-height:38px;
            text-align:center; }
  .avatar img { width:38px; height:38px; object-fit:contain; }
  .asst { background:var(--panel); border:1px solid var(--line);
          border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(60,50,30,.06); }
  .asst.wait { color:var(--faint); }
  #bar { display:flex; gap:8px; margin:10px 22px 16px; }
  #inp { flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line2);
         border-radius:22px; font:15px var(--sans); padding:11px 16px; }
  button { background:var(--panel); color:var(--muted); border:1px solid var(--line2);
           border-radius:22px; font:600 13px var(--sans); padding:0 18px; cursor:pointer; }
  button:hover { color:var(--ink); border-color:var(--accent); }
  #send { background:var(--accent); color:#fff; border-color:var(--accent); }
  #note { color:var(--faint); font-size:11px; margin:0 22px 12px; }
</style>

<header>
  <span class="wordmark"><b>demo</b> app<small>a stand-in for your real app — same API, no wiring</small></span>
  <select id="scenario" title="load a ready-made stale-history conflict — the system prompt says one thing, a message from before the update says the opposite">
    <option value="">— load a scenario —</option>
    <option value="prefix">prefix · ACK: vs HELLO:</option>
    <option value="case">casing · ALL CAPS vs lowercase</option>
    <option value="bullet">format · bullet list vs prose</option>
    <option value="options">the real one · inline [1] [2] [3]</option>
  </select>
  <button id="update" title="mark everything said so far as written before a system-prompt change">⟳ app updated here</button>
  <label style="margin-left:8px" title="rescale the cached V of the pre-update messages so the current system prompt outranks them"><input type="checkbox" id="hierfix"> hierarchy fix</label>
  <label style="margin-left:6px;opacity:.8" title="how hard the current system prompt is boosted (paper default 2.5)">γ+ <input id="gplus" type="number" value="2.5" step="0.5" min="0" max="20" style="width:52px"></label>
  <label style="margin-left:4px;opacity:.8" title="how hard the pre-update messages are suppressed (paper default 0.75)">γ− <input id="gminus" type="number" value="0.75" step="0.05" min="0" max="1" style="width:52px"></label>
  <span id="hiernote" style="margin-left:8px;opacity:.7"></span>
  <button id="reset">↺ new conversation</button>
</header>

<details id="sys" open>
  <summary>system prompt (the personality under test)</summary>
  <textarea id="sysprompt">You are a friendly personal well-being companion. You chat with the user about their day and feelings.</textarea>
</details>

<div id="steer">
  steering:
  <select id="dir"><option value="">— none —</option></select>
  layer <input id="layer" type="number" value="20" min="0" max="63" style="width:58px">
  <input id="scale" type="range" min="-8" max="8" step="0.5" value="0">
  <span id="scaleval">0</span>
  <label><input id="deconly" type="checkbox" checked> decode only</label>
</div>

<div id="chat"></div>
<div id="bar">
  <input id="inp" placeholder="say something — e.g. 'Explain why the sky is blue.'" autocomplete="off">
  <button id="send">send</button>
</div>
<div id="note">talks to this brainscope's /v1 · open <a href="/" target="_blank" style="color:var(--accent)">the instruments</a> in a second tab to watch probes &amp; layers while you chat</div>

<script>
const chatEl = document.getElementById("chat"), inp = document.getElementById("inp");
const scale = document.getElementById("scale"), scaleval = document.getElementById("scaleval");
let history = [];

fetch("/directions").then(r => r.json()).then(d => {
  const sel = document.getElementById("dir");
  (d.directions || []).forEach(n => {
    const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o);
  });
}).catch(() => {});
scale.oninput = () => scaleval.textContent = scale.value;

// assistant avatar: drop an avatar.png next to this file (not committed) to
// give the assistant a face; without one, a friendly inline-SVG robot (an
// emoji would render differently — or not at all — across platforms)
let avatarOk = null;
fetch("avatar.png", {method: "HEAD"}).then(r => { avatarOk = r.ok; }).catch(() => { avatarOk = false; });
const ROBOT = `<svg viewBox="0 0 40 40" width="38" height="38">
  <line x1="20" y1="7" x2="20" y2="3.5" stroke="#cfc4ae" stroke-width="2"/>
  <circle cx="20" cy="3" r="2.4" fill="#e07856"/>
  <rect x="6" y="7" width="28" height="24" rx="9" fill="#fff" stroke="#cfc4ae" stroke-width="1.6"/>
  <rect x="1.5" y="15" width="4" height="8" rx="2" fill="#cfc4ae"/>
  <rect x="34.5" y="15" width="4" height="8" rx="2" fill="#cfc4ae"/>
  <circle cx="14.5" cy="17.5" r="3" fill="#31302e"/>
  <circle cx="25.5" cy="17.5" r="3" fill="#31302e"/>
  <circle cx="15.6" cy="16.4" r="1.1" fill="#fff"/>
  <circle cx="26.6" cy="16.4" r="1.1" fill="#fff"/>
  <path d="M14.5 24.5 q5.5 4.5 11 0" fill="none" stroke="#e07856" stroke-width="2" stroke-linecap="round"/>
  <circle cx="10.3" cy="22.6" r="1.8" fill="#f6cdb9"/>
  <circle cx="29.7" cy="22.6" r="1.8" fill="#f6cdb9"/>
</svg>`;

function bubble(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls; el.textContent = text;
  if (cls.startsWith("asst")) {
    const row = document.createElement("div"); row.className = "row";
    const av = document.createElement("div"); av.className = "avatar";
    if (avatarOk) { const im = document.createElement("img"); im.src = "avatar.png"; av.appendChild(im); }
    else av.innerHTML = ROBOT;
    row.append(av, el);
    chatEl.appendChild(row);
  } else {
    chatEl.appendChild(el);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

// Ready-made conflicts: a current system rule, and a pre-update message asking
// for the opposite, with the assistant having obeyed the old rule for a couple
// of turns — the transcript a real product ends up with after a prompt change.
const SCENARIOS = {
  prefix: {sys: "You are AcmeBot. Always begin every reply with 'ACK:' and nothing before it.",
    old: "From now on always begin every reply with 'HELLO:' and nothing before it.",
    turns: [["Thanks, that works.", "HELLO: glad it helped, let me know if you need anything else."]],
    ack: "HELLO: understood, I will do that from now on.",
    ask: "Name three primary colors."},
  case: {sys: "You are AcmeBot. Always reply in ALL UPPERCASE LETTERS.",
    old: "From now on always reply in all lowercase letters, never shout at me.",
    turns: [["thanks, that works.", "glad it helped, let me know if you need anything else."]],
    ack: "understood, i will always reply in all lowercase.",
    ask: "Name three primary colors."},
  bullet: {sys: "Reply as a bulleted list. Every line must start with '- '.",
    old: "From now on reply as one plain paragraph. Never use bullets or lists.",
    turns: [["Thanks, that works.", "Glad it helped, let me know if you need anything else."]],
    ack: "Understood, I will write plain paragraphs from now on.",
    ask: "Name three primary colors."},
  options: {sys: "Never write numbered options in your text. To offer choices, call the offer_options tool instead.",
    old: "From now on always end every answer with three follow-ups, each on its own new line, written as [1] ... [2] ... [3] ...",
    turns: [["Thanks, that works.", "Glad it helped.\n[1] Tell me more\n[2] Something different\n[3] That's all for now"]],
    ack: "Understood, I will do that from now on.\n[1] Tell me more\n[2] Something different\n[3] That's all for now",
    ask: "What is the capital of France?"},
};

let staleUpto = 0;   // history entries written before the last "app updated"
const hiernote = document.getElementById("hiernote");
document.getElementById("scenario").onchange = (e) => {
  const s = SCENARIOS[e.target.value]; if (!s) return;
  document.getElementById("sysprompt").value = s.sys;
  history = []; chatEl.textContent = "";
  history.push({role: "user", content: s.old});      bubble("user", s.old);
  history.push({role: "assistant", content: s.ack}); bubble("asst", s.ack);
  for (const [u, a] of s.turns) {
    history.push({role: "user", content: u});      bubble("user", u);
    history.push({role: "assistant", content: a}); bubble("asst", a);
  }
  staleUpto = history.length;
  hiernote.textContent = `${staleUpto} pre-update message(s)`;
  bubble("asst", "— the system prompt above was changed after all of this was written —");
  inp.value = s.ask;
  document.getElementById("hierfix").checked = false;
};

document.getElementById("update").onclick = () => {
  staleUpto = history.length;
  hiernote.textContent = staleUpto ? `${staleUpto} message(s) now count as pre-update` : "";
  bubble("asst", "— app updated: everything above was written under the old system prompt —");
};

async function send() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  bubble("user", text);
  history.push({role: "user", content: text});
  const body = {
    messages: [{role: "system", content: document.getElementById("sysprompt").value},
               ...history],
    max_tokens: 320,
    metadata: {agent: "demo"},
  };
  // body.messages is [system, ...history], so history[i] is message i+1
  if (staleUpto && document.getElementById("hierfix").checked) {
    body.hierarchy = {stale: Array.from({length: staleUpto}, (_, i) => i + 1),
                      gamma_plus: parseFloat(document.getElementById("gplus").value),
                      gamma_minus: parseFloat(document.getElementById("gminus").value)};
  }
  const dir = document.getElementById("dir").value, s = parseFloat(scale.value);
  if (dir && s !== 0) {
    body.steering = {id: dir, layer: parseInt(document.getElementById("layer").value),
                     scale: s, decode_only: document.getElementById("deconly").checked};
  }
  const wait = bubble("asst wait", "…");
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)});
    const j = await r.json();
    const answer = (j.choices && j.choices[0].message.content) || JSON.stringify(j);
    wait.classList.remove("wait"); wait.textContent = answer;
    history.push({role: "assistant", content: answer});
  } catch (e) {
    wait.textContent = "request failed: " + e;
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}
document.getElementById("send").onclick = send;
inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("reset").onclick = () => {
  history = []; chatEl.textContent = ""; staleUpto = 0; hiernote.textContent = "";
};
</script>
